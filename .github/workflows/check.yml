name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    steps:
      - name: Install tools
        run: dnf -y install git rpm-build rpmlint 'dnf5-command(builddep)'

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: dnf -y builddep packaging/plasma-light-and-presence.spec

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"

      - name: Check the daemon
        run: python3 -m compileall -q daemon

      - name: Lint the spec
        run: rpmlint packaging/plasma-light-and-presence.spec

      - name: Build the RPMs
        run: |
          make -s -f .copr/Makefile srpm outdir="$PWD/srpm"
          rpmbuild --rebuild --define "_rpmdir $PWD/rpms" srpm/*.src.rpm
